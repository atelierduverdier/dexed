[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "dexed-mcp"
version = "0.1.0"
description = "Serveur MCP pour piloter Dexed (FM/DX7) et Ardour depuis Claude"
readme = "README.md"
license = { text = "GPL-3.0-or-later" }
authors = [{ name = "Atelier du Verdier" }]
requires-python = ">=3.10"
dependencies = ["mcp>=1.2,<2", "python-osc>=1.8", "numpy>=1.24"]

[project.scripts]
dexed-mcp = "dexed_mcp.server:main"

[tool.setuptools]
packages = ["dexed_mcp"]
